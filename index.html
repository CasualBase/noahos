<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Noah's ARK GTA | Cinematic RP</title>
</head>
<body>
    <div class="video-background">
        <img src="noahos.gif" alt="Cinematic Background">
    </div>

    <div class="overlay">
        <header class="header">
            <h1>Noah’s ARK GTA</h1>
            <p>もう一つの人生が、ここにある。</p>
            <div class="cta-group">
                <a href="#process" class="btn">今すぐ参加する</a>
                <a href="https://discord.gg/your-link" class="btn discord">Discordに参加</a>
            </div>
        </header>

        <main class="main-content">
            <section id="process">
                <h2>参加までの流れ</h2>
                <div class="step-container">
                    <div class="step"><span>1</span> Discord参加</div>
                    <div class="step"><span>2</span> ルール確認</div>
                    <div class="step"><span>3</span> 申請</div>
                    <div class="step"><span>4</span> ログイン</div>
                </div>
            </section>
            
            </main>
    </div>

    <footer class="footer">
        <p>『上手じゃなくて良い。楽しいRPを』</p>
        <p>Noah’s ARK © 2026</p>
    </footer>

</html>
